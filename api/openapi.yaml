openapi: "3.0.3"

info:
  title: local-sqs
  description: |
    A lightweight, in-memory SQS-compatible server for local development and testing.

    All operations use the [SQS Query API](https://docs.aws.amazon.com/AWSSimpleQueueService/latest/APIReference/query-interface.html):
    a single `POST /` endpoint with `Content-Type: application/x-www-form-urlencoded`.
    The `Action` field in the request body determines which operation is performed.
  version: "0.1.0"
  license:
    name: MIT

servers:
  - url: http://localhost:9324
    description: Default local server

paths:
  /:
    post:
      summary: SQS Query API endpoint
      description: |
        Single entry point for all SQS operations. The `Action` field selects
        the operation. All requests must use `application/x-www-form-urlencoded`.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              oneOf:
                - $ref: "#/components/schemas/CreateQueueRequest"
                - $ref: "#/components/schemas/DeleteQueueRequest"
                - $ref: "#/components/schemas/ListQueuesRequest"
                - $ref: "#/components/schemas/SendMessageRequest"
                - $ref: "#/components/schemas/ReceiveMessageRequest"
              discriminator:
                propertyName: Action
      responses:
        "200":
          description: Operation succeeded
          content:
            text/xml:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/CreateQueueResponse"
                  - $ref: "#/components/schemas/DeleteQueueResponse"
                  - $ref: "#/components/schemas/ListQueuesResponse"
                  - $ref: "#/components/schemas/SendMessageResponse"
                  - $ref: "#/components/schemas/ReceiveMessageResponse"
        "400":
          description: Bad request — missing or invalid parameters, or unimplemented action
          content:
            text/xml:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "405":
          description: Method not allowed — only POST is accepted

  /openapi.yaml:
    get:
      summary: OpenAPI specification
      description: Returns this OpenAPI specification in YAML format.
      responses:
        "200":
          description: OpenAPI YAML document
          content:
            application/yaml:
              schema:
                type: string

components:
  schemas:

    # -------------------------------------------------------------------------
    # CreateQueue
    # -------------------------------------------------------------------------

    CreateQueueRequest:
      type: object
      required:
        - Action
        - QueueName
      properties:
        Action:
          type: string
          enum: [CreateQueue]
        QueueName:
          type: string
          minLength: 1
          maxLength: 80
          pattern: "^[a-zA-Z0-9_-]{1,80}$"
          description: |
            Queue name. 1–80 characters; alphanumeric, hyphens, and underscores only.
            Calling CreateQueue with an existing name is idempotent and returns the
            existing queue URL.
          example: my-queue

    CreateQueueResponse:
      type: object
      xml:
        name: CreateQueueResponse
      properties:
        CreateQueueResult:
          type: object
          properties:
            QueueUrl:
              type: string
              description: Full URL of the created or existing queue.
              example: http://localhost:9324/queue/my-queue
        ResponseMetadata:
          $ref: "#/components/schemas/ResponseMetadata"

    # -------------------------------------------------------------------------
    # DeleteQueue
    # -------------------------------------------------------------------------

    DeleteQueueRequest:
      type: object
      required:
        - Action
        - QueueUrl
      properties:
        Action:
          type: string
          enum: [DeleteQueue]
        QueueUrl:
          type: string
          description: |
            Full URL of the queue to delete, as returned by CreateQueue.
            Deleting a non-existent queue is idempotent and returns 200.
          example: http://localhost:9324/queue/my-queue

    DeleteQueueResponse:
      type: object
      xml:
        name: DeleteQueueResponse
      properties:
        ResponseMetadata:
          $ref: "#/components/schemas/ResponseMetadata"

    # -------------------------------------------------------------------------
    # ListQueues
    # -------------------------------------------------------------------------

    ListQueuesRequest:
      type: object
      required:
        - Action
      properties:
        Action:
          type: string
          enum: [ListQueues]
        QueueNamePrefix:
          type: string
          description: Filter results to queues whose names begin with this prefix. Optional.
          example: order-

    ListQueuesResponse:
      type: object
      xml:
        name: ListQueuesResponse
      properties:
        ListQueuesResult:
          type: object
          properties:
            QueueUrl:
              type: array
              items:
                type: string
              description: URLs of matching queues, sorted alphabetically.
              example:
                - http://localhost:9324/queue/my-queue
        ResponseMetadata:
          $ref: "#/components/schemas/ResponseMetadata"

    # -------------------------------------------------------------------------
    # SendMessage
    # -------------------------------------------------------------------------

    SendMessageRequest:
      type: object
      required:
        - Action
        - QueueUrl
        - MessageBody
      properties:
        Action:
          type: string
          enum: [SendMessage]
        QueueUrl:
          type: string
          description: Full URL of the target queue, as returned by CreateQueue.
          example: http://localhost:9324/queue/my-queue
        MessageBody:
          type: string
          description: The message payload. Must not be empty.
          example: '{"orderId": "123"}'

    SendMessageResponse:
      type: object
      xml:
        name: SendMessageResponse
      properties:
        SendMessageResult:
          type: object
          properties:
            MessageId:
              type: string
              description: Unique identifier assigned to the message.
              example: 5fea7756-0ea4-451a-a703-a558b933e274
            MD5OfMessageBody:
              type: string
              description: MD5 digest of the message body.
              example: 5eb63bbbe01eeed093cb22bb8f5acdc3
        ResponseMetadata:
          $ref: "#/components/schemas/ResponseMetadata"

    # -------------------------------------------------------------------------
    # ReceiveMessage
    # -------------------------------------------------------------------------

    ReceiveMessageRequest:
      type: object
      required:
        - Action
        - QueueUrl
      properties:
        Action:
          type: string
          enum: [ReceiveMessage]
        QueueUrl:
          type: string
          description: Full URL of the queue to receive messages from.
          example: http://localhost:9324/queue/my-queue
        MaxNumberOfMessages:
          type: integer
          minimum: 1
          maximum: 10
          default: 1
          description: Maximum number of messages to return. Defaults to 1.

    ReceiveMessageResponse:
      type: object
      xml:
        name: ReceiveMessageResponse
      properties:
        ReceiveMessageResult:
          type: object
          properties:
            Message:
              type: array
              items:
                type: object
                properties:
                  MessageId:
                    type: string
                    example: 5fea7756-0ea4-451a-a703-a558b933e274
                  ReceiptHandle:
                    type: string
                    description: Token used to delete the message via DeleteMessage.
                  MD5OfBody:
                    type: string
                    example: 5eb63bbbe01eeed093cb22bb8f5acdc3
                  Body:
                    type: string
                    example: '{"orderId": "123"}'
        ResponseMetadata:
          $ref: "#/components/schemas/ResponseMetadata"

    # -------------------------------------------------------------------------
    # Shared
    # -------------------------------------------------------------------------

    ResponseMetadata:
      type: object
      xml:
        name: ResponseMetadata
      properties:
        RequestId:
          type: string
          example: local

    ErrorResponse:
      type: object
      xml:
        name: ErrorResponse
      properties:
        Error:
          type: object
          properties:
            Type:
              type: string
              example: Sender
            Code:
              type: string
              description: Machine-readable error code.
              example: InvalidParameterValue
            Message:
              type: string
              description: Human-readable error description.
              example: "QueueName is required"
        RequestId:
          type: string
          example: local
